name: Merge shard artifacts

# Merges shard-*.json artifacts from a completed "Full AMC 10 scrape" run
# into data/problems.json, without re-scraping. Trigger by pushing a change
# to scripts/merge-request.json containing {"run_id": <shard run id>}.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Shard run ID to merge artifacts from"
        required: true
  push:
    paths:
      - "scripts/merge-request.json"

permissions:
  contents: write
  actions: read

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Determine run id
        id: rid
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then
            RID="${{ inputs.run_id }}"
          else
            RID=$(python -c "import json;print(json.load(open('scripts/merge-request.json'))['run_id'])")
          fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          run-id: ${{ steps.rid.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble shards and merge
        run: |
          mkdir -p data/shards
          find artifacts -name 'shard-*.json' -exec cp {} data/shards/ \;
          ls -la data/shards/
          python scripts/scrape.py --mode merge
      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf data/shards
          mkdir -p data
          git add -A data
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "scrape: full AMC 10 dataset (2000-2024, A/B/Fall)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
